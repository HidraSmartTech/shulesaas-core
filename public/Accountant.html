<html lang="en">

  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accountant · PSMS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="all">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root{
      --i1:#6366f1; --i2:#8b5cf6; --i3:#a855f7;
      --ink:#0b1120; --muted:#64748b; --line:#e8ecf4;
      --side:#0f172a; --side-2:#131c33;
      --ok:#10b981; --no:#f43f5e; --warn:#f59e0b; --info:#0ea5e9;
      --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.16);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{
      font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background:#f4f6fb;color:var(--ink);-webkit-font-smoothing:antialiased;
    }
    a{text-decoration:none;color:inherit}
    button{font-family:inherit}
    .layout{display:flex;min-height:100vh}

    /* ══ SIDEBAR ══ */
    .sidebar{
      width:252px;background:linear-gradient(178deg,var(--side) 0%,var(--side-2) 55%,#182140 100%);
      display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;
      box-shadow:6px 0 28px -12px rgba(2,6,23,.5)
    }
    .brand{height:66px;display:flex;align-items:center;gap:11px;padding:0 18px;
      border-bottom:1px solid rgba(255,255,255,.07)}
    .logo{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:15px;
      background:linear-gradient(135deg,var(--i1),var(--i3));box-shadow:0 8px 20px -6px rgba(139,92,246,.9)}
    .brand b{font-size:14.5px;display:block;color:#fff;letter-spacing:-.01em}
    .brand span{font-size:9px;color:rgba(148,163,184,.6);letter-spacing:.16em}
    nav{flex:1;overflow-y:auto;padding:12px 10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
    nav::-webkit-scrollbar{width:5px}
    nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px}
    .nav-cap{font-size:9.5px;font-weight:700;letter-spacing:.14em;color:rgba(148,163,184,.5);
      text-transform:uppercase;padding:12px 12px 7px}
    .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;
      font-size:13.5px;font-weight:500;color:rgba(203,213,225,.82);cursor:pointer;margin-bottom:2px;
      transition:background .16s,color .16s;position:relative;overflow:hidden}
    .nav-item i{width:17px;text-align:center;font-size:13.5px;color:rgba(148,163,184,.65);transition:.16s}
    .nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
    .nav-item:hover i{color:#c7d2fe}
    .nav-item.active{background:linear-gradient(135deg,rgba(99,102,241,.32),rgba(168,85,247,.2));color:#fff;font-weight:600}
    .nav-item.active i{color:#a5b4fc}
    .nav-item.active:before{content:"";position:absolute;left:0;top:16%;height:68%;width:3px;border-radius:0 3px 3px 0;
      background:linear-gradient(180deg,#a5b4fc,#e9d5ff)}
    .side-foot{padding:11px;border-top:1px solid rgba(255,255,255,.07)}
    .me-card{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:13px;
      background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);margin-bottom:9px}
    .me-card .nm{font-size:12.5px;font-weight:600;color:#fff;line-height:1.25;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
    .me-card .rl{font-size:10px;color:rgba(148,163,184,.75);line-height:1.2}
    .logout{width:100%;display:flex;align-items:center;gap:11px;padding:9px 12px;border:0;background:none;
      border-radius:11px;font-size:13px;font-weight:500;color:rgba(203,213,225,.82);cursor:pointer;transition:.16s}
    .logout:hover{background:rgba(244,63,94,.16);color:#fda4af}
    .main{flex:1;margin-left:252px;display:flex;flex-direction:column;min-width:0;position:relative}
    @media (max-width:940px){
      .sidebar{transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1)}
      .sidebar.open{transform:none}
      .main{margin-left:0}
      .backdrop{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:35;backdrop-filter:blur(2px)}
    }

    /* ══ TOPBAR ══ */
    .topbar{height:62px;background:rgba(255,255,255,.86);backdrop-filter:blur(16px) saturate(160%);
      -webkit-backdrop-filter:blur(16px) saturate(160%);
      border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;position:sticky;top:0;z-index:30}
    .tb-l{display:flex;align-items:center;gap:12px;min-width:0}
    .crumb{font-size:16px;font-weight:700;letter-spacing:-.015em;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
    .burger{display:none;width:36px;height:36px;place-items:center;background:#fff;border:1px solid var(--line);
      border-radius:11px;color:#475569;cursor:pointer;font-size:14px}
    @media (max-width:940px){.burger{display:grid}}
    .who{display:flex;align-items:center;gap:12px}
    .who .txt{text-align:right}
    .who .txt b{display:block;font-size:13px;font-weight:600}
    .who .txt span{font-size:11px;color:var(--muted)}
    .avatar{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;color:#fff;
      font-size:12.5px;font-weight:700;box-shadow:0 4px 14px -4px rgba(15,23,42,.4)}

    .content{padding:22px;contain:layout style;container-type:inline-size}
    @media (min-width:1024px){.content{padding:28px}}
    .page-head{margin-bottom:20px}
    .h1{font-size:23px;font-weight:800;letter-spacing:-.024em}
    @media (min-width:640px){.h1{font-size:27px}}
    .sub{color:var(--muted);font-size:13.5px;margin-top:4px}

    /* ══ GRID / CARDS ══ */
    .grid{display:grid;gap:15px}
    .g4{grid-template-columns:1fr}
    @media (min-width:540px){.g4{grid-template-columns:repeat(2,1fr)}}
    @media (min-width:1040px){.g4{grid-template-columns:repeat(4,1fr)}}
    .g2{grid-template-columns:1fr}
    @media (min-width:1000px){.g2{grid-template-columns:repeat(2,1fr)}}
    .fee-workspace{grid-template-columns:minmax(0,1fr);align-items:start}
    .fee-actions{display:flex;gap:5px;flex-wrap:wrap;min-width:250px}
    .fee-workspace>.card,.fee-workspace>div{min-width:0}
    .fee-payment-form{width:100%;min-width:0}
    .fee-input-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:100%}
    .fee-input-row.methods{grid-template-columns:repeat(2,minmax(0,1fr))}
    .fee-input-row .inp{width:100%;min-width:0}
    .fee-settings-card{border-color:#dbe4ff}
    .fee-settings-card>.card-h{padding:18px 22px;background:linear-gradient(110deg,#102a56,#164e8a);
      color:#fff;font-size:15px}
    .fee-settings-icon{width:38px;height:38px;display:inline-grid;place-items:center;margin-right:10px;
      border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
      box-shadow:0 7px 16px -7px rgba(99,102,241,.8)}
    .fee-settings-intro{display:flex;align-items:flex-start;gap:12px;padding:15px 17px;margin-bottom:16px;
      border:1px solid #e0e7ff;border-radius:14px;background:linear-gradient(120deg,#f8faff,#faf5ff)}
    .fee-settings-intro i{color:#6366f1;margin-top:2px}
    .fee-settings-intro b{display:block;color:#1e293b;font-size:13px;margin-bottom:3px}
    .fee-settings-intro span{display:block;color:#64748b;font-size:12px;line-height:1.55}
    .fee-structure-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
      align-items:end;padding:17px;border-radius:15px;background:#f8fafc;border:1px solid #edf0f7}
    .fee-field{display:flex;flex-direction:column;gap:6px;min-width:0}
    .fee-field label{font-size:10px;font-weight:800;letter-spacing:.07em;color:#64748b;text-transform:uppercase}
    .fee-term-control{display:flex;gap:7px;min-width:0}
    .fee-term-control select{flex:1;min-width:0}
    .fee-term-control .btn{flex-shrink:0;padding-left:10px;padding-right:10px}
    .fee-term-hint{grid-column:1/-1;color:#6366f1;font-size:11.5px;min-height:15px}
    .fee-structure-table{min-width:max-content}
    .fee-structure-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px}
    #feeStructureTable th:nth-child(n+3){text-align:center}
    #feeStructureTable td:nth-child(n+3){text-align:center;white-space:nowrap}
    #feeStructureTable th:last-child,#feeStructureTable td:last-child{text-align:left}
    #feeStructureTable th:nth-child(n+3):not(:last-child):not(:nth-last-child(2)):before{content:"";display:inline-block;
      width:6px;height:6px;margin:0 6px 1px 0;border-radius:50%;background:#818cf8}
    #feeStructureTable th:nth-last-child(2){background:#eef2ff;color:#312e81;font-weight:800;
      border-left:2px solid #c7d2fe}
    #feeStructureTable td:nth-last-child(2){background:#f8faff;border-left:2px solid #c7d2fe}
    .fee-total-pill{display:inline-block;padding:4px 11px;border-radius:999px;background:#e0e7ff;
      color:#312e81;font-weight:800;font-size:12px}
    .fee-structure-actions{display:flex;align-items:center;gap:6px;min-width:210px}
    .staff-admin-workspace{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
    .staff-admin-workspace>.card,.staff-admin-lists,.staff-admin-lists>.card{min-width:0}
    .staff-provision-form{display:grid;gap:10px}
    .staff-provision-form>.inp,.staff-provision-form select{width:100%;min-width:0;box-sizing:border-box}
    .staff-provision-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
    .staff-provision-password{display:flex;gap:6px;min-width:0}
    .staff-provision-password .inp{width:100%;min-width:0}
    .staff-admin-lists{display:grid;gap:16px}
    @container (min-width:820px){
      .staff-admin-workspace{grid-template-columns:minmax(280px,320px) minmax(0,1fr)}
    }
    @container (max-width:420px){
      .staff-provision-row{grid-template-columns:minmax(0,1fr)}
    }
    @container (min-width:700px){
      .fee-workspace{grid-template-columns:minmax(280px,.85fr) minmax(0,2fr)}
    }
    .mt{margin-top:15px}

    .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
      overflow:hidden}
    .card-h{padding:15px 18px;border-bottom:1px solid #173b70;font-weight:700;font-size:14px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;letter-spacing:-.01em;
      background:linear-gradient(110deg,#0f2345,#173b70);color:#fff}
    .card-b{padding:18px}
    .card-b.tight{padding:6px 18px}

    .stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;
      box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
    .stat:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(15,23,42,.05),0 18px 34px -14px rgba(15,23,42,.24)}
    .stat .ic{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;font-size:15px;margin-bottom:13px}
    .stat .val{font-size:23px;font-weight:800;letter-spacing:-.028em;word-break:break-word;line-height:1.15}
    .stat .lbl{font-size:12.5px;color:var(--muted);margin-top:3px}

    .row{display:flex;align-items:center;justify-content:space-between;gap:11px;padding:11px 0;
      border-bottom:1px solid #f1f5f9;font-size:13.5px}
    .row:last-child{border-bottom:0}
    .row .k{color:#334155}
    .bar{height:7px;background:#eef2f8;border-radius:99px;overflow:hidden}
    .bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--i1),var(--i3));transition:width .5s cubic-bezier(.2,.8,.2,1)}

    .badge{display:inline-block;padding:3.5px 9px;border-radius:8px;font-size:10.5px;font-weight:700;
      letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
    .b-ok{background:#d1fae5;color:#065f46}
    .b-no{background:#ffe4e6;color:#9f1239}
    .b-warn{background:#fef3c7;color:#92400e}
    .b-info{background:#e0f2fe;color:#075985}
    .b-mute{background:#f1f5f9;color:#475569}
    .b-vio{background:#ede9fe;color:#5b21b6}

    table{width:100%;border-collapse:collapse;font-size:13px}
    thead th{text-align:left;padding:10px 11px;color:#fff;font-size:10.5px;font-weight:700;
      text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #173b70;
      background:#102a56;white-space:nowrap;position:sticky;top:0;z-index:1}
    td{padding:11px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
    tbody tr:last-child td{border-bottom:0}
    tbody tr:hover td{background:#f8faff}
    .tbl-wrap{overflow-x:auto;border-radius:12px}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:#f1f5f9;
      padding:2px 6px;border-radius:6px;color:#475569}

    .grade{display:inline-block;padding:3px 7px;border-radius:7px;font-size:11px;font-weight:800}
    .gr-A{background:#d1fae5;color:#065f46}
    .gr-B{background:#dbeafe;color:#1e40af}
    .gr-C{background:#fef3c7;color:#92400e}
    .gr-D{background:#fed7aa;color:#9a3412}
    .gr-F{background:#ffe4e6;color:#9f1239}

    .btn{padding:9px 15px;border:0;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;
      background:linear-gradient(135deg,var(--i1),var(--i2));color:#fff;transition:.18s;
      box-shadow:0 6px 16px -6px rgba(99,102,241,.7)}
    .btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px -6px rgba(99,102,241,.8)}
    .btn.alt{background:#f1f5f9;color:#475569;box-shadow:none}
    .btn.alt:hover{background:#e2e8f0;transform:none;box-shadow:none}
    .btn.ok{background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 6px 16px -6px rgba(16,185,129,.7)}
    .btn.ok:hover{box-shadow:0 10px 22px -6px rgba(16,185,129,.85)}
    .btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}

    .empty{text-align:center;padding:34px 16px;color:#94a3b8;font-size:13.5px}
    .empty i{font-size:28px;display:block;margin-bottom:11px;color:#cbd5e1}
    .mini{font-size:11.5px;color:var(--muted)}
    .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px}
    .tile{padding:16px 14px;border:1px solid var(--line);border-radius:15px;text-align:center;
      background:#fff;cursor:pointer;transition:.18s;box-shadow:var(--shadow)}
    .tile:hover{border-color:#c7d2fe;transform:translateY(-3px);
      box-shadow:0 16px 30px -14px rgba(99,102,241,.5)}
    .tile i{font-size:19px;margin-bottom:9px;display:block}
    .tile b{font-size:12.5px;font-weight:600}

    .toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px;align-items:center}
    select,.inp{padding:9px 12px;border:1px solid var(--line);border-radius:11px;font-size:13px;
      background:#fff;outline:none;transition:.16s;color:var(--ink)}
    select:focus,.inp:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.13)}

    /* ══ SKELETON (perceived speed) ══ */
    .sk{background:linear-gradient(90deg,#eef2f8 25%,#f8fafc 50%,#eef2f8 75%);
      background-size:400% 100%;animation:shimmer 1.3s infinite linear;border-radius:9px}
    @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
    .sk-stat{height:104px}
    .sk-line{height:12px;margin-bottom:9px}
    .sk-card{height:210px}

    .center{display:flex;align-items:center;justify-content:center;min-height:360px;flex-direction:column;gap:14px}
    .loader{width:34px;height:34px;border:3px solid #e2e8f0;border-top-color:var(--i1);border-radius:50%;
      animation:sp .8s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    .page-loading{min-height:320px;display:flex;align-items:center;justify-content:center;padding:24px}
    .page-loading-card{width:min(100%,430px);padding:30px 24px;text-align:center;background:#fff;
      border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
    .page-loading-card .loader{width:42px;height:42px;margin:0 auto 15px}
    .page-loading-card b{display:block;font-size:15px;color:#0f172a}
    .page-loading-card span{display:block;margin-top:6px;color:var(--muted);font-size:12.5px}
    .err-box{text-align:center;max-width:470px}
    .err-box i{font-size:42px;color:var(--no);margin-bottom:12px;display:block}
    .err-box h3{font-size:19px;margin-bottom:6px;letter-spacing:-.02em}
    .err-box p{color:var(--muted);font-size:13.5px;margin-bottom:18px;line-height:1.6}
    .fade-in{animation:fi .28s cubic-bezier(.2,.8,.2,1) both}
    @keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

    .toast{position:fixed;bottom:22px;right:22px;z-index:100;padding:13px 17px;border-radius:14px;
      background:#0f172a;color:#fff;font-size:13.5px;font-weight:500;box-shadow:0 18px 40px -10px rgba(2,6,23,.7);
      display:flex;align-items:center;gap:10px;animation:tin .3s cubic-bezier(.2,.8,.2,1) both;max-width:340px}
    @keyframes tin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    .toast.out{animation:tout .25s both}
    @keyframes tout{to{opacity:0;transform:translateY(16px)}}
    .print-only{display:none}
    .finance-report-paper{margin-top:20px;padding:26px;background:#fff;border:1px solid var(--line);
      border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
    .finance-report-header{display:flex;align-items:center;gap:18px;padding-bottom:18px;
      border-bottom:2px solid #e8ecf4}
    .finance-report-school h1{font-size:23px;font-weight:800;letter-spacing:-.025em}
    .finance-report-motto{margin-top:3px;color:#475569;font-size:12px;font-style:italic}
    .finance-report-contact{margin-top:5px;color:#64748b;font-size:11.5px}
    .finance-report-label{margin-top:9px;color:#4f46e5;font-size:10px;font-weight:800;letter-spacing:.14em}
    .finance-report-title{padding:16px 0 4px}
    .finance-report-title h2{font-size:19px;margin-bottom:5px}
    .finance-report-title>div{color:#64748b;font-size:12px}
    .finance-report-title span{padding:0 5px}
    .finance-report-section{margin-top:19px}
    .finance-report-section>h3{font-size:14px;margin-bottom:9px;color:#1e293b}
    .finance-report-table{min-width:0}
    .finance-report-signoff{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:24px;
      margin-top:32px;padding-top:16px;border-top:1px solid #cbd5e1}
    .finance-report-signoff>div{display:flex;flex-direction:column;gap:5px;min-width:0}
    .finance-report-signoff b{font-size:11px;color:#475569}
    .finance-report-signoff span{font-size:13px;font-weight:600;overflow-wrap:anywhere}
    .finance-report-signoff small{font-size:10px;color:#64748b}
    .finance-report-signature span{height:20px;border-bottom:1px solid #64748b}
    .finance-report-foot{margin-top:18px;padding-top:9px;border-top:1px solid #e2e8f0;
      color:#64748b;font-size:10px;text-align:center}
    body.academic-theme{
      --i1:#7c3aed;--i2:#a855f7;--i3:#06b6d4;
      background:#f0f4fa;font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
    }
    body.academic-theme .sidebar{background:linear-gradient(175deg,#0f172a,#1e1b4b)}

:root,body,body.academic-theme{
  --sw:260px;
  --navy:#0a1628;--navy2:#0f2044;--navy3:#162e5c;
  --blue:#1a56db;--bluel:#3b82f6;--blueglow:rgba(26,86,219,.25);
  --cyan:#06b6d4;--green:#16a34a;--red:#dc2626;--amber:#d97706;--purple:#7c3aed;--pink:#db2777;
  --bg:#f0f4fa;--sf:#fff;--bd:#dde4ef;--tx:#1e2a3a;--mu:#64748b;
  --r:12px;--r2:16px;
  --sh:0 4px 20px rgba(13,27,54,.08);--sh2:0 8px 32px rgba(13,27,54,.14);
  --transition:.2s cubic-bezier(.4,0,.2,1);
  /* this page's own variable names → Admin palette */
  --i1:#1a56db;--i2:#3b82f6;--i3:#06b6d4;
  --ink:#1e2a3a;--muted:#64748b;--line:#dde4ef;
  --side:#070e1f;--side-2:#0a1628;
  --ok:#16a34a;--no:#dc2626;--warn:#d97706;--info:#06b6d4;
  --shadow:0 4px 20px rgba(13,27,54,.08);
}
html{scroll-behavior:smooth}
body,body.academic-theme{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c5d0e0;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* ── Sidebar ── */
.sidebar,body.academic-theme .sidebar{width:var(--sw);background:linear-gradient(180deg,#070e1f 0%,#0a1628 40%,#0c1d3a 100%);box-shadow:4px 0 40px rgba(0,0,0,.5)}
.brand{height:auto;padding:22px 16px 18px;gap:12px;border-bottom:1px solid rgba(255,255,255,.06)}
.logo,body.academic-theme .logo{width:42px;height:42px;border-radius:12px;font-size:18px;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 4px 16px rgba(26,86,219,.5)}
.brand b{font-size:15px;font-weight:800;line-height:1.2;letter-spacing:0}
.brand span{font-size:10px;font-weight:500;letter-spacing:.4px;color:rgba(255,255,255,.3)}
nav{padding:10px 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nav-cap{font-size:9px;font-weight:700;letter-spacing:1.6px;color:rgba(255,255,255,.2);padding:12px 12px 4px}
.nav-item,body.academic-theme .nav-item{padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;color:rgba(255,255,255,.5);margin-bottom:2px;gap:11px;transition:var(--transition);overflow:visible}
.nav-item i{width:18px;font-size:13px;color:inherit}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.nav-item:hover i{color:inherit}
.nav-item.active,body.academic-theme .nav-item.active{background:linear-gradient(135deg,rgba(26,86,219,.75),rgba(6,182,212,.4));color:#fff;font-weight:600;box-shadow:0 4px 16px rgba(26,86,219,.3),inset 0 1px 0 rgba(255,255,255,.1)}
.nav-item.active i,body.academic-theme .nav-item.active i{color:#fff}
.nav-item.active:before,body.academic-theme .nav-item.active:before{display:block;content:'';position:absolute;left:0;top:20%;height:60%;width:3px;background:linear-gradient(to bottom,var(--cyan),var(--blue));border-radius:0 3px 3px 0}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.06)}
.me-card{padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}

.card,body.academic-theme .card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:var(--transition)}

/* ── Stat tiles (Admin "widget" look) ── */
.stat,body.academic-theme .stat{padding:18px 16px 16px;border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--sh);transition:var(--transition);cursor:default}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:transparent}
.stat::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.stat .ic,body.academic-theme .stat .ic{width:44px;height:44px;border-radius:12px;font-size:18px;margin-bottom:12px}
.stat .val,body.academic-theme .stat .val{font-size:26px;font-weight:900;letter-spacing:0;line-height:1;font-variant-numeric:tabular-nums}
.stat .lbl,body.academic-theme .stat .lbl{font-size:11px;font-weight:600;color:var(--mu);margin-top:4px}
.bar>div{background:linear-gradient(90deg,var(--blue),var(--cyan))}

/* ── Buttons ── */
.btn,body.academic-theme .btn:not(.alt):not(.ok){display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:9px;font-size:12.5px;font-weight:800;letter-spacing:.2px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--bluel));box-shadow:0 4px 12px rgba(26,86,219,.3);transition:var(--transition)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,86,219,.3)}
.btn:active{transform:translateY(0)}
.btn.alt{background:#f1f5f9;color:var(--tx);border:1px solid var(--bd);box-shadow:none}

.btn.ok{background:linear-gradient(135deg,var(--green),#22c55e);box-shadow:0 4px 12px rgba(22,163,74,.3)}
.btn.ok:hover{box-shadow:0 4px 12px rgba(22,163,74,.3)}
.btn.sm{padding:5px 11px;font-size:11.5px;border-radius:8px}

/* ── Forms ── */
select,.inp,body.academic-theme .inp,body.academic-theme select{padding:9px 12px;border:1.5px solid var(--bd);border-radius:9px;font-size:13px;font-family:inherit;color:var(--tx);background:#fff;transition:var(--transition)}
select:focus,.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blueglow)}

/* ── Tables ── */
thead th,body.academic-theme thead th{background:linear-gradient(90deg,var(--navy),var(--navy2));color:rgba(255,255,255,.85);padding:11px 12px;font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;border-bottom:0}
td{padding:10px 12px;border-bottom:1px solid #f0f4f8}
tbody tr:hover td{background:#f8faff}
.tbl-wrap{border-radius:var(--r)}
.tile:hover{border-color:#93c5fd;box-shadow:var(--sh2)}
.page-loading-card{border-radius:var(--r2);box-shadow:var(--sh)}

/* ── Badges ── */
.b-ok{background:#dcfce7;color:#15803d}.b-no{background:#fee2e2;color:#b91c1c}.b-warn{background:#fef3c7;color:#b45309}
.b-info{background:#dbeafe;color:#1d4ed8}.b-mute{background:#f1f5f9;color:#475569}.b-vio{background:#ede9fe;color:#6d28d9}

.toast{padding:13px 18px;border-radius:12px;font-size:13px;font-weight:700;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;box-shadow:0 8px 32px rgba(0,0,0,.15);min-width:280px;bottom:24px;right:24px;z-index:9999}

/* ── Logout button + signing-out screen ── */
.lo-btn,.logout.lo-btn{position:relative;display:flex;align-items:center;gap:12px;width:calc(100% - 16px);margin:6px 8px 4px;padding:9px 12px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:800;letter-spacing:.2px;text-align:left;color:#fecaca;background:linear-gradient(135deg,rgba(220,38,38,.24),rgba(239,68,68,.10));border:1px solid rgba(248,113,113,.30);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden;transition:all .22s cubic-bezier(.4,0,.2,1)}
.lo-btn::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);transition:left .5s}

.lo-btn .lo-ic i{transition:transform .22s}
.lo-btn .lo-tx{flex:1}
.lo-btn .lo-sp{width:17px;height:17px;border-radius:50%;border:2.5px solid rgba(255,255,255,.28);border-top-color:#fff;opacity:0;transform:scale(.5);transition:all .2s}
.lo-btn:hover{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(220,38,38,.42);transform:translateY(-1px)}
.lo-btn:hover::before{left:120%}
.lo-btn:hover .lo-ic{background:rgba(255,255,255,.22);color:#fff}
.lo-btn:hover .lo-ic i{transform:translateX(2px)}
.lo-btn:active{transform:translateY(0) scale(.98)}
.lo-btn.busy{pointer-events:none;background:linear-gradient(135deg,#b91c1c,#dc2626);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(220,38,38,.35)}

.lo-btn.busy .lo-sp{opacity:1;transform:scale(1);animation:loSpin .7s linear infinite}
#logoutOv{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,rgba(26,86,219,.35),transparent 55%),rgba(7,14,31,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .25s ease}
#logoutOv.show{opacity:1}
.lo-card{width:min(340px,86vw);padding:30px 26px 24px;border-radius:20px;text-align:center;background:linear-gradient(160deg,#0f2044,#0a1628);border:1px solid rgba(255,255,255,.10);box-shadow:0 24px 80px rgba(0,0,0,.5);color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;transform:scale(.94);transition:transform .25s ease}
#logoutOv.show .lo-card{transform:scale(1)}
.lo-ring{position:relative;width:64px;height:64px;margin:0 auto 18px}
.lo-ring i{position:absolute;inset:0;border-radius:50%;border:4px solid transparent}
.lo-ring i:nth-child(1){border-top-color:#3b82f6;border-right-color:#3b82f6;animation:loSpin 1s linear infinite}

.lo-bar{height:4px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden}
.lo-bar span{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#1a56db,#06b6d4);animation:loBar 1.1s ease-in-out infinite}
@keyframes loSpin{to{transform:rotate(360deg)}}
@keyframes loBar{0%{margin-left:-40%}100%{margin-left:100%}}

/* ── Refresh page button ── */
.rf-btn{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;margin-right:10px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--tx);font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(13,27,54,.06);transition:all .2s cubic-bezier(.4,0,.2,1);white-space:nowrap}

.skel{padding:6px 2px}
.skel i{display:block;height:14px;border-radius:8px;margin:14px 0;width:100%;background:linear-gradient(90deg,#e8eef8 25%,#f6f9fe 50%,#e8eef8 75%);background-size:200% 100%;animation:skelp 1.2s ease-in-out infinite}
.skel i:first-child{height:84px;border-radius:12px}

  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}
  .main{margin-left:0}
  .topbar{padding:0 14px}.content{padding:16px 14px}
}

/* ═══════════════════════════════════════════════════════════
   PSMS DASHBOARD — single-page app
   Speed features:
   • Page payload cache  → instant re-render on revisit
   • Hover prefetch      → next page starts loading before click
   • Parallel warm-up    → likely pages fetched at boot
   • Skeleton loaders    → perceived speed, no blank flash
   • Template cache      → HTML built once per payload

/* ─────────── API BRIDGE (single entry) ─────────── */
var C_MAX = 3, C_BG_MAX = 1, C_ACTIVE = 0, C_BG_ACTIVE = 0, C_QUEUE = [];
/* at most 3 server calls at once, and only ONE of them may be background pre-loading,
   so a page you click on never waits behind a queue of pre-loads */
function cCanRun(job){ return C_ACTIVE < C_MAX && !window.__lo && (!job.bg || C_BG_ACTIVE < C_BG_MAX); }
function cRun(job){
  C_ACTIVE++; if (job.bg) C_BG_ACTIVE++;
  var done = false, wasBg = !!job.bg;
  function fin(){ if (done) return false; done = true; clearTimeout(wd); C_ACTIVE = Math.max(0, C_ACTIVE - 1); if (wasBg) C_BG_ACTIVE = Math.max(0, C_BG_ACTIVE - 1); cNext(); return true; }
  var wd = setTimeout(fin, 45000);               // a hung call can never block the queue
  google.script.run
    .withSuccessHandler(function(r){ fin(); job.resolve(r); })
    .withFailureHandler(function(e){ fin(); job.reject(e); })
    .apiRequest(job.payload);
}
function cNext(){
  for (var i = 0; i < C_QUEUE.length && C_ACTIVE < C_MAX && !window.__lo; ) {
    if (cCanRun(C_QUEUE[i])) cRun(C_QUEUE.splice(i, 1)[0]); else i++;
  }
}
function cPromote(job){                          // the user now wants this page → no longer background
  var i = C_QUEUE.indexOf(job); if (i < 0) return;
  job.bg = false;
  if (i > 0) { C_QUEUE.splice(i, 1); C_QUEUE.unshift(job); }
  cNext();
}
function callApi(payload, bg){
  var job = { payload: payload, bg: !!bg };
  var p = new Promise(function(resolve, reject){
    if (typeof google === "undefined" || !google.script || !google.script.run) {
      reject(new Error("google.script.run is unavailable. Open the app from your Web App URL."));
      return;
    }
    job.resolve = resolve; job.reject = reject;
    if (cCanRun(job)) cRun(job);
    else if (bg) C_QUEUE.push(job);
    else C_QUEUE.unshift(job);                   // what you click jumps the queue
  });
  p.__job = job;
  return p;
}

/** Fetch a page once; dedupe concurrent requests for the same page */
function fetchPage(page, extra, bg){
  var key = page + (extra ? JSON.stringify(extra) : "");
  if (PENDING[key]) { if (!bg && PENDING[key].__job) cPromote(PENDING[key].__job); return PENDING[key]; }
  var body = { action:"dashboard", token:TOKEN, page:page };
  if (extra) for (var k in extra) body[k] = extra[k];
  var p0 = callApi(body, bg);
  PENDING[key] = p0.then(function(res){
    delete PENDING[key];
    if (res && res.ok) { STORE[key] = res.data; STORE_T[key] = Date.now(); persistStore(key, res.data); }
    return res;
  })["catch"](function(e){ delete PENDING[key]; throw e; });
  PENDING[key].__job = p0.__job;
  return PENDING[key];
}

/* ─────────── UTILITIES ─────────── */
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function money(n){ return "TZS " + Math.round(Number(n) || 0).toLocaleString("en-US"); }
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fdate(v){
  if (!v) return "—";
  var d = new Date(v); if (isNaN(d.getTime())) return String(v).substring(0,10);
  return ("0"+d.getDate()).slice(-2) + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
}
function ago(v){
  if (!v) return "—";
  var t = new Date(v).getTime(); if (isNaN(t)) return String(v);
  var m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return "Just now";
  if (m < 60) return m + (m === 1 ? " min ago" : " mins ago");
  var h = Math.floor(m/60); if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  var dd = Math.floor(h/24);
  return dd + (dd === 1 ? " day ago" : " days ago");
}
function initials(n){
  return String(n||"").trim().split(/\s+/).slice(0,2).map(function(p){return p.charAt(0);}).join("").toUpperCase();
}
function avatarColor(n){
  var c = ["#6366f1","#8b5cf6","#0ea5e9","#10b981","#14b8a6","#f59e0b","#f43f5e","#d946ef"];
  var s = 0; for (var i=0;i<String(n).length;i++) s += String(n).charCodeAt(i);
  return c[s % c.length];
}
function gradeCls(g){ return "grade gr-" + esc(g); }
function tone(s){
  s = String(s||"").toLowerCase();
  if (["present","active","win","completed","paid","high"].indexOf(s) !== -1) return "b-ok";
  if (["absent","loss","overdue","failed"].indexOf(s) !== -1) return "b-no";
  if (["late","ongoing","draw","pending","medium"].indexOf(s) !== -1) return "b-warn";
  if (["scheduled","mpesa","bank","normal","parents"].indexOf(s) !== -1) return "b-info";
  return "b-mute";
}

  STORE = {}; PREFETCHED = {}; clearPersistedStore(); C_QUEUE.length = 0; C_ACTIVE = 0; C_BG_ACTIVE = 0;
  setTimeout(function(){ try { location.reload(); } catch (e) {} }, 450);
  setTimeout(function(){                           // reload blocked or slow → refresh in place
    window.__rf = false;
    if (b) { b.classList.remove("busy"); if (t) t.textContent = "Refresh"; }

/** ⚡ Prefetch on hover — page is ready before the user clicks */
function prefetch(page){
  if (PREFETCHED[page] || STORE[page] || page === PAGE) return;
  PREFETCHED[page] = true;
  fetchPage(page, null, true)["catch"](function(){});
}

/** ⚡ Warm the pages the user is most likely to open next */
function warmUp(){
  /* load EVERY page of this role in the background, so clicking any menu item is instant */
  var items = NAV[ME.role] || [];
  items.forEach(function(it, i){
    if (it[0] === PAGE) return;
    setTimeout(function(){ if (!window.__lo && !window.__rf) prefetch(it[0]); }, 1500 + i * 250);
  });
}

function go(page, extra){
  PAGE = page;
  var loadId = ++PAGE_LOAD_ID;
  try { sessionStorage.setItem("psms_page", page); } catch (e) {}
  var nodes = document.querySelectorAll(".nav-item");
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].className = "nav-item" + (nodes[i].getAttribute("data-p") === page ? " active" : "");
  }
  if (window.innerWidth <= 940) {
    var sb = document.getElementById("sidebar");
    if (sb.classList.contains("open")) toggleSidebar();
  }

  var key = page + (extra ? JSON.stringify(extra) : "");
  var c = document.getElementById("content");

  // ⚡ Instant paint from cache — no spinner at all
  if (STORE[key]) {
    render(page, STORE[key], extra);
    if (STORE_T[key] && Date.now() - STORE_T[key] < 20000) return;   // fresh → no extra server call
    fetchPage(page, extra).then(function(res){
      if (loadId === PAGE_LOAD_ID && PAGE === page && res && res.ok) {
        STORE[key] = res.data; persistStore(key, res.data);
        render(page, res.data, extra);
      }
    })["catch"](function(){});
    return;
  }

  c.innerHTML = shell(page, loadingPage(page));

  fetchPage(page, extra).then(function(res){
    if (loadId !== PAGE_LOAD_ID || PAGE !== page) return;
    if (!res || !res.ok) {
      var msg = (res && res.error) || "An unexpected error occurred";
      if (/session has expired/i.test(msg)) { backToLogin(msg); return; }
      renderError(msg); return;
    }
    render(page, res.data, extra);
  })["catch"](function(err){
    if (loadId === PAGE_LOAD_ID && PAGE === page) {
      renderError((err && err.message) ? err.message : String(err));
    }
  });
}

function render(page, d, extra){
  var el = document.getElementById("content");
  var fn = PAGES[page];
  try {
    el.innerHTML = shell(page, fn ? fn(d, extra || {}) : '<div class="empty"><i class="fas fa-toolbox"></i>This module is being prepared</div>');
    wireAdminForm();
  } catch (e) {
    renderError("Render error: " + e.message);
  }
}

function doLogout(){
  if (window.__lo) return;

  // Clear the stored session immediately so a refresh cannot resume it
  try { sessionStorage.clear(); } catch (e) {}
  TOKEN = ""; ME = null; STORE = {}; clearPersistedStore();
  C_QUEUE.length = 0;                             // drop every waiting background call
  loBusy(); loOverlay();

  google.script.run
    .withSuccessHandler(function (html) {
      window.__loDone = true;

    })
    .withFailureHandler(function () {
      // Last resort: try a normal navigation
      try { window.location.href = String(window.location.href).split("?")[0] + "?page=login"; }
      catch (e) { document.body.innerHTML = '<p style="padding:30px">Please reload the page.</p>'; }
    })
    .getLoginPage();
  setTimeout(function(){ if (!window.__loDone) { try { location.reload(); } catch (e) {} } }, 4000);   // never get stuck
}

/** Export any rendered table body to CSV */
function exportCsv(name, wrapId) {
  var rows = [];
  var table = document.querySelector("#" + wrapId + " table");
  if (!table) { toast("Nothing to export.", "fa-triangle-exclamation"); return; }
  var head = [];
  var th = table.querySelectorAll("thead th");
  for (var h = 0; h < th.length; h++) head.push(th[h].textContent.trim());
  rows.push(head.join(","));
  var tr = table.querySelectorAll("tbody tr");
  for (var r = 0; r < tr.length; r++) {
    if (tr[r].style.display === "none") continue;
    var cells = tr[r].querySelectorAll("td"), line = [];
    for (var c = 0; c < cells.length; c++) {
      var v = cells[c].innerText.trim().replace(/\n/g, " ").replace(/"/g, '""');
      line.push(/[",]/.test(v) ? '"' + v + '"' : v);
    }
    rows.push(line.join(","));
  }
  var blob = new Blob([rows.join("\n")], { type: "text/csv;charset=utf-8;" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (name || "export") + "-" + new Date().toISOString().substring(0, 10) + ".csv";

  toast("Exported to CSV.", "fa-file-csv");
}

results: function (d, extra) {
  var rows = (d.rows || []).slice().sort(function (a, b) { return b.total - a.total; });
  var opts = '<option value="">Select an examination</option>';
  for (var i = 0; i < (d.exams || []).length; i++) {
    var e = d.exams[i];
    opts += '<option value="' + e.id + '"' + ((d.exam && d.exam.id === e.id) ? " selected" : "") + '>' +
            esc(e.name + " · " + e.term) + '</option>';
  }
  var body = rows.map(function (r) {
    var chips = (r.subjects || []).map(function (s) {
      return '<span class="' + gradeCls(s.grade) + '" title="' + esc(s.subjectName) + '">' +
             esc(s.subjectCode) + ': ' + s.score + '</span>';
    }).join(" ");
    return ['<b>#' + (r.position || "—") + '</b>',
            '<b>' + esc(r.studentName) + '</b><div class="mini">' + esc(r.admissionNo) + '</div>',
            esc(r.className), chips, '<b>' + r.total + '</b>', r.average,
            '<span class="' + gradeCls(r.grade) + '">' + esc(r.grade) + '</span>', esc(r.remarks || "—")];
  });
  if (ME.role === "head") {
    var classOpts = '<option value="">Select class</option>';
    var headExamOpts = opts.replace("Select an examination", "Select Exam type");
    for (var c = 0; c < (d.classes || []).length; c++) {
      classOpts += '<option value="' + esc(d.classes[c].id) + '"' +
        (d.classId === d.classes[c].id ? " selected" : "") + '>' + esc(d.classes[c].name) + '</option>';
    }
    return '<div class="card"><div class="card-h">Results Performance Monitor' +
      (d.exam ? ' · ' + esc(d.exam.name) : '') + '</div><div class="card-b">' +
      '<div class="toolbar"><label class="mini" for="headResultClass">Select Class</label>' +
      '<select class="inp" id="headResultClass" aria-label="Select class" onchange="go(\'results\',{classId:this.value,examId:document.getElementById(\'headResultExam\').value})">' +
      classOpts + '</select><label class="mini" for="headResultExam">Select Exam type</label>' +

      'onchange="go(\'results\',{classId:document.getElementById(\'headResultClass\').value,examId:this.value})">' +
      headExamOpts + '</select></div>' +

      '</div></div>';

    '<div class="toolbar"><select class="inp" onchange="go(\'results\',{examId:this.value})">' + opts + '</select></div>' +
    table(["Rank","Student","Class","Subject scores","Total","Average","Grade","Remarks"], body) +

},

    '<div id="rcOut"><div class="empty"><i class="fas fa-file"></i>Select a student, then click “Generate report”.</div></div></div></div>';

attendance: function (d) {
  if (ME.role === "head") {
    var month = d.month || new Date().toISOString().substring(0, 7);
    var headClassOpts = '<option value="">Select class</option>';
    for (var hc = 0; hc < (d.classes || []).length; hc++) {
      headClassOpts += '<option value="' + esc(d.classes[hc].id) + '"' +
        (d.classId === d.classes[hc].id ? " selected" : "") + '>' + esc(d.classes[hc].name) + '</option>';
    }
    var totals = { present:0, late:0, absent:0 };
    var monthlyRows = (d.students || []).map(function (student) {
      var counts = { present:0, late:0, absent:0 }, seenDays = {};
      for (var ar = 0; ar < (d.records || []).length; ar++) {
        var record = d.records[ar];
        if (record.studentId !== student.id) continue;
        if (counts[record.status] !== undefined) {
          counts[record.status]++;
          totals[record.status]++;
        }
        seenDays[record.date] = true;
      }
      var days = Object.keys(seenDays).length;
      var rate = days ? Math.round((counts.present + counts.late) / days * 100) : 0;
      return ['<b>' + esc(student.firstName + ' ' + student.lastName) + '</b>' +
              '<div class="mini">' + esc(student.admissionNo) + '</div>',
              String(counts.present), String(counts.late), String(counts.absent), String(days), rate + '%'];
    });
    var rateDenominator = totals.present + totals.late + totals.absent;
    var overallRate = rateDenominator ? Math.round((totals.present + totals.late) / rateDenominator * 100) : 0;
    var report = d.classId
      ? '<div class="grid g4 mt">' +
        statCard("Students in class", (d.students || []).length, "fa-users", "#6366f1") +
        statCard("Present records", totals.present, "fa-user-check", "#10b981") +
        statCard("Late records", totals.late, "fa-clock", "#f59e0b") +
        statCard("Absent records", totals.absent, "fa-user-xmark", "#f43f5e") +
        statCard("Monthly attendance rate", overallRate + "%", "fa-chart-line", "#0ea5e9") +
        '</div><div class="card mt"><div class="card-h">Monthly attendance details</div><div class="card-b tight">' +
        table(["Student","Present","Late","Absent","Days recorded","Attendance rate"], monthlyRows) +
        '</div></div>'
      : '<div class="empty"><i class="fas fa-filter"></i>Select a class to view its monthly attendance report.</div>';
    return '<div class="card"><div class="card-h"><span><i class="fas fa-chart-column"></i> Monthly Attendance Report</span></div>' +
      '<div class="card-b"><div class="toolbar"><label class="mini" for="headAttendanceClass">Select Class</label>' +
      '<select class="inp" id="headAttendanceClass" aria-label="Select class" ' +
      'onchange="go(\'attendance\',{classId:this.value,month:document.getElementById(\'headAttendanceMonth\').value})">' +
      headClassOpts + '</select><label class="mini" for="headAttendanceMonth">Select Month</label>' +
      '<input class="inp" id="headAttendanceMonth" type="month" value="' + esc(month) +
      '" aria-label="Select month" onchange="go(\'attendance\',{classId:document.getElementById(\'headAttendanceClass\').value,month:this.value})">' +
      '</div>' + report + '</div></div>';
  }

  var st = d.students || [], rec = d.records || [], map = {};
  for (var i = 0; i < rec.length; i++) map[rec[i].studentId] = rec[i].status;
  if (!st.length) return '<div class="card"><div class="card-b"><div class="empty"><i class="fas fa-calendar-check"></i>No students found for your class</div></div></div>';

  var opts = '<option value="">My class</option>';
  for (var c = 0; c < (d.classes || []).length; c++)
    opts += '<option value="' + d.classes[c].id + '"' + (d.classId === d.classes[c].id ? " selected" : "") + '>' +
            esc(d.classes[c].name) + '</option>';

  var html = '<div class="card"><div class="card-h"><span>Attendance · ' + fdate(d.date) +
    ' · ' + st.length + ' students</span>' +
    '<button class="btn ok" onclick="saveAttendance()"><i class="fas fa-floppy-disk"></i> Save attendance</button></div><div class="card-b">' +
    '<div class="toolbar"><select class="inp" onchange="go(\'attendance\',{classId:this.value})">' + opts + '</select>' +
    '<span class="mini">Mark each student, then save. Existing marks for today are replaced.</span></div>';

  for (var s = 0; s < st.length; s++) {
    var x = st[s], cur = map[x.id] || "";
    html += '<div class="row" data-sid="' + x.id + '"><span><b>' + esc(x.firstName + ' ' + x.lastName) + '</b> ' +
      '<span class="mini">' + esc(x.admissionNo) + '</span></span><span>';
    var opts3 = ["present","late","absent"];
    for (var o = 0; o < 3; o++) {
      var key = opts3[o], on = cur === key;
      var bg = key === "present" ? "#10b981" : key === "late" ? "#f59e0b" : "#f43f5e";
      html += '<button onclick="pickAtt(this,\'' + key + '\')" style="padding:6px 12px;border:0;border-radius:9px;' +
        'font-size:12px;font-weight:600;cursor:pointer;margin-left:5px;' +
        (on ? 'background:' + bg + ';color:#fff' : 'background:#f1f5f9;color:#475569') + '">' + key + '</button>';
    }
    html += '</span></div>';
  }
  return html + '</div></div>';
},

    '<div class="card"><div class="card-h">Recent Payments (' + (d.payments||[]).length + ')</div><div class="card-b tight">' +
    table(["Receipt","Student","Class","Amount","Method","Date","Term"], rows) + '</div></div></div>';

              esc(x.className), esc(x.position)];
    })) + '</div></div></div>';
},

matches: function (d) {

              '<b>' + x.scoreUs + " – " + x.scoreThem + '</b>', badge(x.result)];

/* ───────── PARENT ───────── */
children: function (d) {
  var kids = d.children || [];
  if (!kids.length) return '<div class="card"><div class="card-b"><div class="empty"><i class="fas fa-children"></i>' +
    'No child is linked to your account yet. Please contact the class teacher.</div></div></div>';
  var h = '<div class="grid g2">';
  for (var i = 0; i < kids.length; i++) {
    var c = kids[i], att = c.attendance || [], pr = 0;
    for (var j = 0; j < att.length; j++) if (att[j].status === "present") pr++;
    var rate = att.length ? Math.round(pr / att.length * 100) : 0;

    var bySub = {};
    for (var k = 0; k < (c.marks||[]).length; k++) {
      var mk = c.marks[k];
      if (!bySub[mk.subjectName] || mk.score > bySub[mk.subjectName].score) bySub[mk.subjectName] = mk;
    }
    var keys = Object.keys(bySub);
    var marksHtml = "";
    if (keys.length) {
      marksHtml = '<div style="margin-top:15px;font-weight:700;font-size:13px;margin-bottom:9px">Best score per subject</div>';
      for (var q = 0; q < keys.length; q++) {
        var mm = bySub[keys[q]];
        marksHtml += '<div style="margin-bottom:10px"><div class="row" style="padding:0 0 4px;border:0">' +
          '<span class="k">' + esc(keys[q]) + '</span><span><b>' + mm.score + '</b> <span class="' + gradeCls(mm.grade) + '">' +
          esc(mm.grade) + '</span></span></div>' +
          '<div class="bar"><div style="width:' + mm.score + '%"></div></div></div>';
      }
    }
    h += '<div class="card"><div class="card-h">' + esc(c.firstName + ' ' + c.lastName) + ' · ' + esc(c.className) + '</div><div class="card-b">' +
      '<div class="row"><span class="k">Admission no.</span><code>' + esc(c.admissionNo) + '</code></div>' +
      '<div class="row"><span class="k">Gender</span><b>' + esc(c.gender) + '</b></div>' +
      '<div class="row"><span class="k">Date of birth</span><b>' + fdate(c.dateOfBirth) + '</b></div>' +
      '<div class="row"><span class="k">Attendance rate</span><b>' + rate + '%</b></div>' +
      '<div class="row"><span class="k">Fees invoiced</span><b>' + money(c.fee ? c.fee.fee : 0) + '</b></div>' +
      '<div class="row"><span class="k">Fees paid</span><b style="color:#059669">' + money(c.fee ? c.fee.paid : 0) + '</b></div>' +
      '<div class="row"><span class="k">Balance</span><b style="color:' + ((c.fee&&c.fee.balance>0)?"#dc2626":"#059669") + '">' +
      money(c.fee ? c.fee.balance : 0) + '</b></div>' + marksHtml + '</div></div>';
  }
  return h + '</div>';

    statCard("Total Income", money(t.income), "fa-arrow-trend-up", "#10b981") +

    statCard("School Balance", money(t.balance), "fa-scale-balanced", t.balance >= 0 ? "#0ea5e9" : "#f43f5e") +

    '</div><div class="grid g4 mt">' +
    statCard("Pending Payments", money(t.pendingPayments), "fa-clock", "#f59e0b") +
    statCard("Outstanding Debts", money(t.outstandingDebt), "fa-hand-holding-dollar", "#ef4444") +

    '<div class="mini" style="text-align:center;margin-top:8px">Income per month</div></div></div>' +
    '<div class="card"><div class="card-h">Expenditure Trend</div><div class="card-b">' +
    finBar(monthly.map(function(m){return m.label;}), monthly.map(function(m){return m.expenditure;}), "#f43f5e", "#f59e0b") +
    '<div class="mini" style="text-align:center;margin-top:8px">Expenditure per month</div></div></div>' +
    '</div>';

  var sum = '<div class="card mt"><div class="card-h">Monthly Financial Summary</div><div class="card-b tight">' +
    table(["Month","Income","Expenditure","Net","Status"], monthly.map(function (m) {
      return ['<b>' + esc(m.label) + '</b>', money(m.income), money(m.expenditure),
              '<b style="color:' + (m.net >= 0 ? "#059669" : "#dc2626") + '">' + money(m.net) + '</b>',
              badge(m.net >= 0 ? "completed" : "loss")];
    })) + '</div></div>';

  var breakdown = '<div class="grid g2 mt">' +

  var ck = Object.keys(d.expenseByCategory || {});
  if (!ck.length) breakdown += '<div class="empty">No expenses recorded</div>';
  for (var c = 0; c < ck.length; c++) {
    var v = d.expenseByCategory[ck[c]];
    var pct = t.expenditure > 0 ? Math.round((v / t.expenditure) * 100) : 0;
    breakdown += '<div style="margin-bottom:10px"><div class="row" style="padding:0 0 4px;border:0">' +
      '<span class="k">' + esc(ck[c]) + '</span><b>' + money(v) + '</b></div>' +
      '<div class="bar"><div style="width:' + pct + '%;background:linear-gradient(90deg,#f43f5e,#f59e0b)"></div></div></div>';
  }
  breakdown += '</div></div>';

  breakdown += '<div class="card"><div class="card-h">Income Sources</div><div class="card-b">';
  var ik = Object.keys(d.incomeByCategory || {});
  if (!ik.length) breakdown += '<div class="empty">No other income recorded</div>';
  for (var i = 0; i < ik.length; i++) {
    var iv = d.incomeByCategory[ik[i]];
    var ipct = t.otherIncome > 0 ? Math.round((iv / t.otherIncome) * 100) : 0;
    breakdown += '<div style="margin-bottom:10px"><div class="row" style="padding:0 0 4px;border:0">' +
      '<span class="k">' + esc(ik[i]) + '</span><b>' + money(iv) + '</b></div>' +
      '<div class="bar"><div style="width:' + ipct + '%;background:linear-gradient(90deg,#10b981,#14b8a6)"></div></div></div>';
  }
  breakdown += '</div></div></div>';

  var debtors = '<div class="card mt"><div class="card-h">Top Debtors (' + (o.debtorCount || 0) +
    ' students owe ' + money(t.outstandingDebt) + ')</div><div class="card-b tight">' +
    table(["Student","Admission no.","Class","Due","Paid","Balance"],

              '<b style="color:#dc2626">' + money(r.outstanding) + '</b>', String(r.debtors),

finSettings: function (d) {
  var clOpts = '<option value="">Select class…</option>';
  for (var c = 0; c < (d.classes || []).length; c++)
    clOpts += '<option value="' + esc(d.classes[c].id) + '">' + esc(d.classes[c].name) + '</option>';
  var fees = d.feeStructures || [];
  var terms = [];
  for (var t = 0; t < fees.length; t++) {
    if (terms.indexOf(fees[t].term) === -1) terms.push(fees[t].term);
  }
  if (!terms.length) terms.push("Term 1");
  terms.sort(function (a, b) {
    var an = Number(String(a).match(/\d+/));
    var bn = Number(String(b).match(/\d+/));
    return (an || 999) - (bn || 999) || a.localeCompare(b);
  });

  var groups = {}, groupOrder = [];
  for (var f = 0; f < fees.length; f++) {
    var fee = fees[f];
    var key = String(fee.classId) + "|" + String(fee.academicYear || d.academicYear || "");
    if (!groups[key]) {
      groups[key] = { classId: fee.classId, className: fee.className, academicYear: fee.academicYear || d.academicYear || "", feesByTerm: {} };
      groupOrder.push(key);
    }
    groups[key].feesByTerm[fee.term] = fee;
  }
  for (var c2 = 0; c2 < (d.classes || []).length; c2++) {
    var cls = d.classes[c2];
    var currentKey = String(cls.id) + "|" + String(d.academicYear || "");
    if (!groups[currentKey]) {
      groups[currentKey] = { classId: cls.id, className: cls.name, academicYear: d.academicYear || "", feesByTerm: {} };
      groupOrder.push(currentKey);
    }
  }
  groupOrder.sort(function (a, b) {
    return String(groups[a].className).localeCompare(String(groups[b].className)) ||
      String(groups[b].academicYear).localeCompare(String(groups[a].academicYear));
  });

  var feeRows = groupOrder.map(function (key) {
    var group = groups[key];
    var termCells = terms.map(function (term) {
      var item = group.feesByTerm[term];
      return item
        ? '<b>' + money(item.amount) + '</b>'
        : '<span class="mini">—</span>';
    });
    var annualTotal = 0;
    terms.forEach(function (term) {
      var ti = group.feesByTerm[term];
      if (ti) annualTotal += Number(ti.amount) || 0;
    });
    var totalCell = annualTotal > 0
      ? '<span class="fee-total-pill">' + money(annualTotal) + '</span>'
      : '<span class="mini">—</span>';
    var availableTerms = terms.filter(function (term) { return !!group.feesByTerm[term]; });
    var optionHtml = availableTerms.map(function (term) {
      return '<option value="' + esc(term) + '">' + esc(term) + '</option>';
    }).join("");
    var action = availableTerms.length
      ? '<div class="fee-structure-actions">' +
        '<select class="inp fee-action-term" data-class-id="' + esc(group.classId) +
        '" data-year="' + esc(group.academicYear) + '">' + optionHtml + '</select>' +
        '<button class="btn sm alt" onclick="finEditFeeStructure(this)" title="Edit fee"><i class="fas fa-pen-to-square"></i> Edit</button>' +
        '<button class="btn sm alt" style="background:#fee2e2;color:#b91c1c" onclick="finDeleteFeeStructure(this)" title="Delete fee"><i class="fas fa-trash-can"></i> Delete</button>' +
        '</div>'
      : '<span class="mini">No fee set</span>';
    return ['<b>' + esc(group.className || "—") + '</b>', esc(group.academicYear)]
      .concat(termCells).concat([totalCell, action]);
  });
  var headers = ["Class", "Year"].concat(terms).concat(["Total Annual Fee", "Action"]);
  return '<div class="card fee-settings-card"><div class="card-h">' +
    '<span><span class="fee-settings-icon"><i class="fas fa-sliders"></i></span>Set Fee Structure</span>' +
    '<span class="badge b-vio">' + esc(d.academicYear || "") + '</span></div><div class="card-b">' +
    '<div class="fee-settings-intro"><i class="fas fa-wand-magic-sparkles"></i><div>' +
    '<b>Flexible fee terms</b><span>Add a class fee for any term. New terms automatically become columns in this table and are available for other classes.</span>' +
    '</div></div>' +
    '<div class="toolbar fee-structure-form">' +
    '<div class="fee-field"><label for="ffClass">Class</label><select class="inp" id="ffClass">' + clOpts + '</select></div>' +
    '<div class="fee-field"><label for="ffAmount">Fee amount (TZS)</label>' +
    '<input class="inp" id="ffAmount" type="number" min="1" placeholder="Enter amount"></div>' +
    '<div class="fee-field"><label for="ffTerm">Payment term</label><div class="fee-term-control">' +
    '<select class="inp" id="ffTerm">' + terms.map(function (term) {
      return '<option>' + esc(term) + '</option>';
    }).join("") + '</select><button class="btn alt" type="button" onclick="finAddNextFeeTerm()" title="Add next term">' +
    '<i class="fas fa-plus"></i> Add term</button></div></div>' +
    '<div class="fee-field"><label for="ffDesc">Description</label>' +
    '<input class="inp" id="ffDesc" placeholder="Optional description"></div>' +
    '<div class="fee-field"><label>&nbsp;</label><button class="btn" onclick="finSaveFeeStructure()">' +
    '<i class="fas fa-layer-group"></i> Save fee</button></div>' +
    '<div class="fee-term-hint" id="ffTermHint" aria-live="polite"></div></div>' +
    '<div class="mt fee-structure-table-wrap" id="feeStructureTable">' +
    '<div class="fee-structure-table">' + table(headers, feeRows) + '</div></div></div></div>';
},

finReports: function (d) {

    '</div></div>';

  var incomeRows = d.incomeRows || [], expenseRows = d.expenseRows || [];
  var incomeTable = table(["Date","Category","Description / Source","Method","Reference","Amount"],
    incomeRows.map(function (r) {
      return [fdate(r.date), esc(r.category || "Income"),
        '<b>' + esc(r.description || "—") + '</b>' +
          (r.source ? '<div class="mini">' + esc(r.source) + '</div>' : ''),
        esc(r.method || "—"), '<code>' + esc(r.reference || "—") + '</code>',
        '<b>' + money(r.amount) + '</b>'];
    }));
  var expenseTable = table(["Date","Category","Description","Method","Reference","Status","Amount"],
    expenseRows.map(function (r) {
      return [fdate(r.date), esc(r.category || "Expense"), esc(r.description || "—"),
        esc(r.method || "—"), '<code>' + esc(r.reference || "—") + '</code>',
        esc(r.status || "Pending"), '<b>' + money(r.amount) + '</b>'];
    }));

  function categoryRows(categories) {
    return Object.keys(categories || {}).sort().map(function (category) {
      return [esc(category), money(categories[category])];
    });
  }
  var summaryTable = table(["Financial summary","Amount"], [
    ["Opening balance (recorded transactions)", '<b>' + money(s.openingBalance) + '</b>'],
    ["Income (" + (s.incomeCount || 0) + " transactions)", '<b style="color:#059669">' + money(s.income) + '</b>'],
    ["Paid expenditure (" + (s.expenseCount || 0) + " records)", '<b style="color:#dc2626">(' + money(s.expenditure) + ')</b>'],
    ["Net movement", '<b>' + money(s.net) + '</b>'],
    ["Closing balance", '<b>' + money(s.closingBalance) + '</b>']
  ]);
  var categorySummary = '<div class="grid g2 mt">' +
    '<div class="card"><div class="card-h">Income by category</div><div class="card-b tight">' +
    table(["Category","Total"], categoryRows(d.incomeByCategory)) + '</div></div>' +
    '<div class="card"><div class="card-h">Paid expenditure by category</div><div class="card-b tight">' +
    table(["Category","Total"], categoryRows(d.expenseByCategory)) + '</div></div></div>';

  var logo = d.schoolLogoUrl
    ? '<img src="' + esc(d.schoolLogoUrl) + '" alt="School logo" style="max-width:76px;max-height:76px;object-fit:contain">'
    : '<div style="width:64px;height:64px;border-radius:16px;background:#eef2ff;color:#4f46e5;display:grid;place-items:center;font-size:26px"><i class="fas fa-school"></i></div>';
  var schoolMeta = [d.schoolAddress, d.schoolPhone, d.schoolEmail].filter(Boolean).map(esc).join(" · ");
  var reportHeader = '<div class="finance-report-header">' + logo +
    '<div class="finance-report-school"><h1>' + esc(d.schoolName || "School") + '</h1>' +
    (d.schoolMotto ? '<div class="finance-report-motto">' + esc(d.schoolMotto) + '</div>' : '') +
    (schoolMeta ? '<div class="finance-report-contact">' + schoolMeta + '</div>' : '') +
    '<div class="finance-report-label">OFFICIAL FINANCIAL REPORT</div></div></div>' +
    '<div class="finance-report-title"><h2>' + esc(d.title || "Financial Report") + '</h2>' +
    '<div>Reporting period: ' + fdate(d.from) + ' – ' + fdate(d.to) +
    ' <span>·</span> Academic year: ' + esc(d.academicYear || "—") + '</div></div>';
  var prepared = '<div class="finance-report-signoff"><div><b>Prepared by</b><span>' +
    esc(d.generatedBy || "—") + '</span><small>' + esc(d.generatedByRole || "") + '</small></div>' +
    '<div><b>Generated on</b><span>' + fdate(d.generatedAt) + '</span><small>' +
    esc(String(d.generatedAt || "").substring(11, 16)) + '</small></div>' +
    '<div class="finance-report-signature"><b>Authorized signature</b><span></span><small>Name / Signature / Date</small></div></div>' +
    '<div class="finance-report-foot">Generated by PSMS · ' + esc(d.schoolName || "School") +
    ' · Income includes fees received and registered income. Expenditure totals include paid items only; other statuses are listed for reference. Opening and closing balances are based on recorded transactions.</div>';

  var report = '<div id="financeReportPrintArea" class="finance-report-paper">' +
    reportHeader +
    '<section class="finance-report-section"><h3>Income &amp; Expenditure Summary</h3>' + summaryTable + '</section>' +
    '<section class="finance-report-section"><h3>Income Transactions (' + incomeRows.length + ')</h3>' +
    '<div class="finance-report-table">' + incomeTable + '</div></section>' +
    '<section class="finance-report-section"><h3>Expenditure Records (' + expenseRows.length + ')</h3>' +
    '<div class="finance-report-table">' + expenseTable + '</div></section>' +
    '<section class="finance-report-section"><h3>Category Totals</h3>' + categorySummary + '</section>' +
    prepared + '</div>';

  return '<div class="grid g2">' + picker + '<div class="card"><div class="card-h">Report at a glance</div>' +
    '<div class="card-b">' + summaryTable + categorySummary + '</div></div></div>' + report;
},

    var links = (d.parentLinks || []).map(function (link) {
      return [esc(link.parentName), '<b>' + esc(link.studentName) + '</b>',
        '<button class="btn sm alt" onclick="unlinkParent(\'' + esc(link.linkId) + '\')">' +
        '<i class="fas fa-link-slash"></i> Unlink</button>'];
    });
    return '<div class="grid g4">' +
      statCard("Students in my class", (d.students || []).length, "fa-users", "#6366f1") +
      statCard("Parent-child links", (d.stats || {}).parentLinks || 0, "fa-link", "#d946ef") +
      '</div><div class="card mt"><div class="card-h">Link a parent to a student' +
      (d.className ? ' · ' + esc(d.className) : '') + '</div><div class="card-b">' +
      (d.className ? '<div class="toolbar"><select class="inp" id="linkParent">' + parentOpts + '</select>' +
        '<select class="inp" id="linkStudent">' + studentOpts + '</select>' +
        '<button class="btn ok" onclick="linkParentStudent()"><i class="fas fa-link"></i> Link</button></div>' +
        table(["Parent","Student","Action"], links)
        : '<div class="empty"><i class="fas fa-school"></i>No class is assigned to your account yet.</div>') +
      '</div></div>';
  }

  var s = d.stats || {};
  var top = '<div class="grid g4">' +
    statCard("Class teacher slots", (s.classTeacherSlotsFilled || 0) + " / " + (s.classTeacherSlotsTotal || 0),
             "fa-school", "#6366f1") +
    statCard("Subject slots filled", (s.subjectSlotsFilled || 0) + " / " + (s.subjectSlotsTotal || 0),
             "fa-book-open", "#0ea5e9") +
    statCard("Staff with duties", s.staffWithAssignments || 0, "fa-user-check", "#10b981") +
    (ME.role === "academic" ? "" :
      statCard("Parent-child links", s.parentLinks || 0, "fa-children", "#d946ef")) +
    '</div>';

  // Class teacher assignment
  var classOpts = "";
  for (var c = 0; c < (d.classes || []).length; c++) {
    classOpts += '<option value="' + d.classes[c].id + '">' + esc(d.classes[c].name) + '</option>';
  }
  var ctOpts = '<option value="">— Not assigned —</option>';
  for (var t = 0; t < (d.staff || []).length; t++) {
    var x = d.staff[t];
    if (x.role === "class_teacher" && x.isActive) {
      ctOpts += '<option value="' + x.id + '">' + esc(x.fullName) + '</option>';
    }
  }
  var assignCt = '<div class="card mt"><div class="card-h">Assign class teachers</div><div class="card-b tight">' +
    '<table><thead><tr><th>Class</th><th>Current class teacher</th><th style="width:230px">Assign to</th></tr></thead><tbody>';
  for (var i = 0; i < (d.classes || []).length; i++) {
    var cl = d.classes[i];
    assignCt += '<tr><td><b>' + esc(cl.name) + '</b></td><td>' +
      (cl.teacherName ? esc(cl.teacherName) : '<span class="badge b-warn">vacant</span>') + '</td>' +
      '<td><div style="display:flex;gap:6px">' +
      '<select class="inp ctSel" data-cid="' + cl.id + '" style="flex:1;min-width:0">' +
      ctOpts.replace('value="' + cl.classTeacherId + '"', 'value="' + cl.classTeacherId + '" selected') +
      '</select>' +
      '<button class="btn sm" onclick="saveClassTeacher(this)">Save</button></div></td></tr>';
  }
  assignCt += '</tbody></table></div></div>';

  // Subject teacher assignment
  var subjRows = (d.subjectAssignments || []).map(function (r) {
    var opts = '<option value="">— Not assigned —</option>';
    for (var k = 0; k < (d.staff || []).length; k++) {
      var m = d.staff[k];
      if ((m.role === "teacher" || m.role === "class_teacher" || m.role === "academic") && m.isActive) {
        opts += '<option value="' + m.id + '"' + (m.id === r.teacherId ? " selected" : "") + '>' +
                esc(m.fullName) + '</option>';
      }
    }
    return ['<b>' + esc(r.className) + '</b>', esc(r.subjectName), '<code>' + esc(r.subjectCode) + '</code>',
            r.teacherName ? esc(r.teacherName) : '<span class="badge b-warn">vacant</span>',
            '<div style="display:flex;gap:6px">' +
            '<select class="inp subjSel" data-lid="' + r.linkId + '" style="flex:1;min-width:0">' + opts + '</select>' +
            '<button class="btn sm" onclick="saveSubjectTeacher(this)">Save</button></div>'];
  });

  // Parent-child links are managed separately from Academic's staff assignments.
  var parentLinksPanel = "";
  if (ME.role !== "academic") {
  var linkRows = (d.parentLinks || []).map(function (l) {
    return [esc(l.parentName), '<b>' + esc(l.studentName) + '</b>',
            '<button class="btn sm alt" onclick="unlinkParent(\'' + l.linkId + '\')">' +
            '<i class="fas fa-link-slash"></i> Unlink</button>'];
  });

  var newLink = '<div class="card mt"><div class="card-h">Link a student to a parent</div><div class="card-b">' +
    '<div class="toolbar"><select class="inp" id="linkParent"><option value="">Select parent…</option>';
  for (var p = 0; p < (d.parents || []).length; p++) {
    newLink += '<option value="' + d.parents[p].id + '">' + esc(d.parents[p].name) + '</option>';
  }
  newLink += '</select><select class="inp" id="linkStudent"><option value="">Select student…</option>';
  for (var q = 0; q < (d.students || []).length; q++) {
    var su = d.students[q];
    newLink += '<option value="' + su.id + '">' + esc(su.firstName + ' ' + su.lastName + ' · ' + su.className) + '</option>';
  }
  newLink += '</select><button class="btn ok" onclick="linkParentStudent()">' +
    '<i class="fas fa-link"></i> Link</button></div>' +
    table(["Parent","Student",""], linkRows) + '</div></div>';
    parentLinksPanel = newLink;
  }

  return top + assignCt +
    '<div class="card mt"><div class="card-h">Subject teacher assignments</div><div class="card-b tight">' +
    table(["Class","Subject","Code","Current teacher","Assign to"], subjRows) + '</div></div>' +
    parentLinksPanel;
}
};

function loadMarksSheet(){
  var examId = document.getElementById("mkExam").value;
  var idx = Number(document.getElementById("mkAsg").value);
  var asg = ((STORE["marks"] || {}).assignments || [])[idx];
  if (!asg) { toast("Please choose a class and subject.", "fa-triangle-exclamation"); return; }

  document.getElementById("marksSheet").innerHTML = '<div class="sk sk-card"></div>';

  callApi({ action:"students", token:TOKEN, classId:asg.classId }).then(function (res) {
    if (!res || !res.ok) { toast(res ? res.error : "Could not load students", "fa-triangle-exclamation"); return; }
    var st = res.data.students, html = '<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Student</th>' +
      '<th>Admission no.</th><th>Score (/100)</th><th>Grade</th></tr></thead><tbody>';
    for (var i = 0; i < st.length; i++) {
      html += '<tr><td>' + (i+1) + '</td><td><b>' + esc(st[i].firstName + ' ' + st[i].lastName) + '</b></td>' +
        '<td><code>' + esc(st[i].admissionNo) + '</code></td>' +
        '<td><input class="inp mk-score" data-sid="' + st[i].id + '" type="number" min="0" max="100" style="width:96px"></td>' +
        '<td class="mk-grade mini">—</td></tr>';
    }
    html += '</tbody></table></div><div style="margin-top:14px;text-align:right">' +
      '<button class="btn ok" onclick="submitMarks(\'' + examId + '\',\'' + asg.subjectId + '\')">' +
      '<i class="fas fa-floppy-disk"></i> Save marks</button></div>';
    document.getElementById("marksSheet").innerHTML = html;

    var inputs = document.querySelectorAll(".mk-score");
    for (var k = 0; k < inputs.length; k++) {
      inputs[k].addEventListener("input", function () {
        var v = Number(this.value);
        var g = (this.value === "" || isNaN(v)) ? null : gradeOf(v);
        var cell = this.closest("tr").querySelector(".mk-grade");
        cell.innerHTML = g ? '<span class="' + gradeCls(g) + '">' + g + '</span>' : '—';
      });
    }
  });
}
function gradeOf(s){ return s >= 80 ? "A" : s >= 65 ? "B" : s >= 45 ? "C" : s >= 30 ? "D" : "F"; }

function submitMarks(examId, subjectId){
  var inputs = document.querySelectorAll(".mk-score"), entries = [];
  for (var i = 0; i < inputs.length; i++) {
    if (inputs[i].value === "") continue;
    var v = Number(inputs[i].value);
    if (isNaN(v)) continue;
    entries.push({ studentId: inputs[i].getAttribute("data-sid"), examId: examId,
                   subjectId: subjectId, score: v, maxScore: 100 });
  }
  if (!entries.length) { toast("Enter a score for at least one student.", "fa-triangle-exclamation"); return; }
  callApi({ action:"saveMarks", token:TOKEN, entries:entries }).then(function (res) {
    if (!res || !res.ok) { toast(res ? res.error : "Could not save marks", "fa-triangle-exclamation"); return; }
    toast(res.data.saved + " marks saved successfully.");
    STORE = {}; clearPersistedStore(); go("marks");
  });
}

function pickAtt(btn, status){
  var row = btn.closest(".row");
  row.setAttribute("data-status", status);
  var btns = row.querySelectorAll("button");
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i], s = b.textContent;
    var bg = s === "present" ? "#10b981" : s === "late" ? "#f59e0b" : "#f43f5e";
    if (b === btn) { b.style.background = bg; b.style.color = "#fff"; }
    else { b.style.background = "#f1f5f9"; b.style.color = "#475569"; }
  }
}

function saveAttendance(){
  var rows = document.querySelectorAll(".row[data-sid]"), recs = [];

}

function finAddNextFeeTerm() {
  var select = document.getElementById("ffTerm");
  if (!select) return;
  var highest = 0;
  for (var i = 0; i < select.options.length; i++) {
    var match = String(select.options[i].value).match(/^Term\s*(\d+)$/i);
    if (match) highest = Math.max(highest, Number(match[1]));
  }
  var nextTerm = "Term " + (highest + 1);
  var option = document.createElement("option");
  option.value = nextTerm;
  option.textContent = nextTerm;
  select.appendChild(option);
  select.value = nextTerm;
  var hint = document.getElementById("ffTermHint");
  if (hint) hint.textContent = nextTerm + " added. Save the fee to create its column in the table.";
}

function finRecordPayment() {
  var sid = document.getElementById("fpStudent").value;
  var amount = Number(document.getElementById("fpAmount").value);
  var force = document.getElementById("fpForce").checked;
  var term = document.getElementById("fpTerm").value;

  if (!sid) { toast("Please select a student.", "fa-triangle-exclamation"); return; }
  if (document.getElementById("fpTerm").options.length > 1 && !term) {
    toast("Please select a fee term.", "fa-triangle-exclamation"); return;
  }
  if (!amount || amount <= 0) { toast("Please enter a valid amount.", "fa-triangle-exclamation"); return; }

  showSavingOverlay("Recording the payment…");

  callApi({ action:"recordPaymentFinance", token:TOKEN, studentId:sid, amount:amount,
            term:term,
            date:document.getElementById("fpDate").value,
            paymentMethod:document.getElementById("fpMethod").value,
            paymentType:document.getElementById("fpType").value,
            reference:document.getElementById("fpRef").value,
            force:force }).then(function (res) {
    hideSavingOverlay();
    if (!res || !res.ok) {
      var msg = (res && res.error) || "Could not record the payment.";
      var box = document.getElementById("fpResult");
      if (box) {
        box.style.display = "block";
        var isDup = /DUPLICATE/i.test(msg);
        box.style.background = isDup ? "#fffbeb" : "#fef2f2";
        box.style.border = "1px solid " + (isDup ? "#fde68a" : "#fecaca");
        box.innerHTML = '<b style="color:' + (isDup ? "#92400e" : "#b91c1c") + '">' + esc(msg) + '</b>' +
          (isDup ? '<div style="margin-top:9px">' +
            '<button class="btn sm ok" onclick="document.getElementById(\'fpForce\').checked=true;' +
            'finRecordPayment()">Record anyway</button></div>' : "");
      }
      toast(msg, "fa-triangle-exclamation");
      return;
    }

    if (box) box.style.display = "none";
    toast("Payment recorded. Receipt " + res.data.receiptNo, "fa-receipt");

    FINANCE_RECEIPT_TO_PRINT = res.data;
    openModal("Payment Receipt",
      '<div style="text-align:center;border-bottom:1px dashed #cbd5e1;padding-bottom:14px;margin-bottom:14px">' +
      '<i class="fas fa-receipt" style="font-size:30px;color:#10b981;display:block;margin-bottom:8px"></i>' +
      '<b style="font-size:16px">Official Receipt</b>' +
      '<div class="mini">No. ' + esc(res.data.receiptNo) + '</div></div>' +
      '<div class="row"><span class="k">School</span><b>' + esc((res.data.schoolProfile || {}).name || "School") + '</b></div>' +
      '<div class="row"><span class="k">Student</span><b>' + esc(res.data.studentName) + '</b></div>' +

function filterPaymentStudents(query) {
  var select = document.getElementById("fpStudent");
  if (!select) return;
  var students = (STORE["finFees"] || {}).students || [];
  var q = String(query || "").trim().toLowerCase();
  var selected = select.value;
  var matches = students.filter(function (student) {
    var text = [student.firstName, student.middleName, student.lastName,
      student.admissionNo, student.className].join(" ").toLowerCase();
    return !q || text.indexOf(q) !== -1;
  });
  select.innerHTML = '<option value="">Select student… (' + matches.length + ')</option>' +
    matches.map(function (student) {
      return '<option value="' + esc(student.id) + '">' +
        esc(student.firstName + " " + student.lastName + " · " +
          student.admissionNo + " · " + student.className) + '</option>';
    }).join("");
  if (matches.some(function (student) { return String(student.id) === selected; })) {
    select.value = selected;
  }
  refreshFeeTermOptions(select.value);
}

function refreshFeeTermOptions(studentId) {
  var select = document.getElementById("fpTerm");
  if (!select) return;
  var data = STORE["finFees"] || {};
  var students = data.students || [];
  var fees = data.feeStructures || [];
  var student = null;
  for (var i = 0; i < students.length; i++) {
    if (String(students[i].id) === String(studentId)) { student = students[i]; break; }
  }
  var year = String(data.academicYear || "");
  var terms = [];
  for (var j = 0; j < fees.length; j++) {
    if (student && String(fees[j].classId) === String(student.classId) &&
        String(fees[j].academicYear) === year &&
        terms.indexOf(String(fees[j].term)) === -1) {
      terms.push(String(fees[j].term));
    }
  }
  terms.sort(function (a, b) {
    var aNumber = Number((a.match(/\d+/) || [0])[0]);
    var bNumber = Number((b.match(/\d+/) || [0])[0]);
    return aNumber - bNumber || a.localeCompare(b);
  });
  select.innerHTML = terms.length
    ? '<option value="">Select term…</option>' + terms.map(function (term) {
        return '<option value="' + esc(term) + '">' + esc(term) + '</option>';
      }).join("")
    : '<option value="">No fee terms configured for this class</option>';
}
