function receiptDetail(label, value) {
  return '<div class="detail"><span class="label">' + esc(label) +
    '</span><span class="colon">:</span><span class="value">' + esc(value) + '</span></div>';
}

function receiptCurrencyLabel(currency) {
  var value = String(currency || "TZS").toUpperCase();
  return value === "TZS" ? "TSh" : value;
}

function receiptMoney(value, currency) {
  var amount = Number(value);
  if (!isFinite(amount)) amount = 0;
  return receiptCurrencyLabel(currency) + " " + amount.toLocaleString("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function receiptAmountInWords(value, currency) {
  var amount = Math.round((Number(value) || 0) * 100) / 100;
  var whole = Math.floor(Math.abs(amount));
  var cents = Math.round((Math.abs(amount) - whole) * 100);
  var currencyNames = {
    TZS: "Tanzanian Shillings",
    KES: "Kenyan Shillings",
    UGX: "Ugandan Shillings",
    USD: "US Dollars",
    GBP: "Pounds Sterling"
  };
  var currencyCode = String(currency || "TZS").toUpperCase();
  var ones = ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine",
    "Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen",
    "Eighteen","Nineteen"];
  var tens = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function underThousand(number) {
    var words = [];
    if (number >= 100) {
      words.push(ones[Math.floor(number / 100)] + " Hundred");
      number %= 100;
    }
    if (number >= 20) {
      var ten = tens[Math.floor(number / 10)];
      if (number % 10) ten += " " + ones[number % 10];
      words.push(ten);
    } else if (number > 0) {
      words.push(ones[number]);
    }
    return words.join(" ");
  }
  function integerWords(number) {
    if (!number) return "Zero";
    var scales = ["","Thousand","Million","Billion","Trillion"];
    var parts = [], scaleIndex = 0;
    while (number > 0 && scaleIndex < scales.length) {
      var group = number % 1000;
      if (group) parts.unshift(underThousand(group) + (scales[scaleIndex] ? " " + scales[scaleIndex] : ""));
      number = Math.floor(number / 1000);
      scaleIndex++;
    }
    return parts.join(" ");
  }
  var words = (amount < 0 ? "Minus " : "") +
    (currencyNames[currencyCode] || currencyCode) + " " + integerWords(whole);
  if (cents) words += " and " + cents + "/100";
  return words + " Only";
}

        String(fees[i].academicYear) === String(academicYear) &&
        String(fees[i].term) === String(term)) {
      fee = fees[i];
      break;
    }
  }
  if (!fee) { toast("Fee structure not found. Refresh and try again.", "fa-triangle-exclamation"); return; }
  if (!confirm("Delete the " + term + " fee for " + fee.className + " (" + academicYear + ")?")) return;
  callApi({ action:"deleteFinanceRecord", token:TOKEN, entity:"feeStructures", id:fee.id }).then(function (res) {
    if (!res || !res.ok) { toast(res ? res.error : "Could not delete fee structure", "fa-triangle-exclamation"); return; }
    toast("Fee structure deleted.");
    finGo("finSettings");
  })["catch"](function (err) {
    toast("Could not delete fee structure: " + (err && err.message ? err.message : err), "fa-triangle-exclamation");
  });
}

var ADMIN_EDITING = null;
var ADMIN_SPEC_SETS = {};

function adminSpecSetFor(position) {
  var o = (STORE["adminsAdmin"] && STORE["adminsAdmin"].options) || {};
  return position === "Accountant"
    ? (o.accountingSpecializations || [])
    : (o.educationSpecializations || []);
}

/** Populate the specialization dropdown depending on the chosen position */
function onPositionChange() {
  var pos = document.getElementById("adPos").value;
  var sel = document.getElementById("adSpec");
  var set = adminSpecSetFor(pos);

  var html = '<option value="">-- Select --</option>';
  for (var i = 0; i < set.length; i++) html += '<option value="' + esc(set[i]) + '">' + esc(set[i]) + '</option>';
  html += '<option value="Other (Please specify)">Other (Please specify)</option>';
  sel.innerHTML = html;

  // Label reflects the position
  var lbl = document.getElementById("adSpecLbl");
  if (lbl) lbl.innerHTML = pos === "Accountant"
    ? "Area of Specialization (Accounting) *"
    : "Area of Specialization *";

  // Reset any custom value
  var other = document.getElementById("adSpecOther");
  if (other) { other.style.display = "none"; other.value = ""; }
}

function onQualificationChange() {
  var val = document.getElementById("adQual").value;
  var other = document.getElementById("adQualOther");
  if (!other) return;
  var show = val === "Other (Please specify)";
  other.style.display = show ? "block" : "none";

function saveAdministrator() {
  var body = {
    action: "saveAdministrator", token: TOKEN,
    profilePictureUrl: document.getElementById("adPic").value.trim(),
    fullName:      document.getElementById("adName").value.trim(),
    sex:           document.getElementById("adSex").value,
    position:      document.getElementById("adPos").value,
    qualification: document.getElementById("adQual").value,
    qualificationOther: document.getElementById("adQualOther").value.trim(),
    specialization:document.getElementById("adSpec").value,
    specOther:     document.getElementById("adSpecOther").value.trim(),
    yearsExperience: document.getElementById("adExp").value.trim(),
    username:      document.getElementById("adUser").value.trim().toLowerCase(),
    password:      document.getElementById("adPass").value
  };

  if (ADMIN_EDITING) {
    body.id = ADMIN_EDITING.id;
    body.email = ADMIN_EDITING.email || "";
    body.phone = ADMIN_EDITING.phone || "";
  }

  /* --- client-side validation --- */
  if (!body.fullName)       { showAdminNotice("err", "Full name is required."); return; }
  if (!body.sex)            { showAdminNotice("err", "Please select a sex."); return; }
  if (!body.position)       { showAdminNotice("err", "Please select a position."); return; }
  if (!body.qualification)  { showAdminNotice("err", "Please select the highest academic qualification."); return; }
  if (body.qualification === "Other (Please specify)" && !body.qualificationOther) {
    showAdminNotice("err", "Please specify the qualification."); return;
  }
  if (!body.specialization) { showAdminNotice("err", "Please select an area of specialization."); return; }
  if (!body.username)       { showAdminNotice("err", "Username is required."); return; }
  if (!ADMIN_EDITING && body.password.length < 6) {
    showAdminNotice("err", "Password must be at least 6 characters."); return;
  }
  if (ADMIN_EDITING && body.password && body.password.length < 6) {
    showAdminNotice("err", "Password must be at least 6 characters."); return;
  }

  var btn = document.getElementById("adSaveBtn");
  var btnTxt = document.getElementById("adSaveTxt");
  btn.disabled = true;
  btn.style.opacity = "0.85";
  btn.style.cursor = "progress";
  btnTxt.innerHTML = SPIN + " Saving…";

  showSavingOverlay(ADMIN_EDITING ? "Updating record…" : "Creating the account…");

  callApi(body).then(function (res) {
    hideSavingOverlay();
    btn.disabled = false;
    btn.style.opacity = "1";
    btn.style.cursor = "pointer";
    btnTxt.innerHTML = ADMIN_EDITING ? "Update record" : "Save Administrator";

    if (!res || !res.ok) {
      showAdminNotice("err", (res && res.error) || "Could not save the administrator.");
      return;
    }

    if (res.data.mode === "create") {
      showAdminNotice("ok",
        res.data.message + '<br>Username <code>' + esc(res.data.username) + '</code> · Password <code>' +
        esc(res.data.password) + '</code> — copy these now, the password will not be shown again.');
      syncCredentialStrip();
    } else {
      showAdminNotice("ok", res.data.message);
    }

    toast(res.data.message);
    var wasEditing = !!ADMIN_EDITING;
    clearAdminForm();
    if (wasEditing) { STORE = {}; clearPersistedStore(); go("adminsAdmin"); }
    else { STORE = {}; clearPersistedStore(); go("adminsAdmin"); }
  })["catch"](function (err) {
    hideSavingOverlay();
    btn.disabled = false;
    btn.style.opacity = "1";
    btn.style.cursor = "pointer";
    btnTxt.innerHTML = "Save Administrator";
    showAdminNotice("err", "Network error: " + (err && err.message ? err.message : err));
  });
}

function editAdministrator(id) {
  callApi({ action: "administratorDetail", token: TOKEN, id: id }).then(function (res) {
    if (!res || !res.ok) { toast(res ? res.error : "Could not load the record", "fa-triangle-exclamation"); return; }
    var a = res.data.admin;
    ADMIN_EDITING = a;

    document.getElementById("adPic").value  = a.pictureUrl || "";
    document.getElementById("adName").value = a.fullName || "";
    document.getElementById("adSex").value  = a.sex || "";
    document.getElementById("adPos").value  = a.position || "";
    onPositionChange();

    var qual = a.qualification || "";
    if (qual.indexOf("Other:") === 0) {
      document.getElementById("adQual").value = "Other (Please specify)";
      document.getElementById("adQualOther").value = qual.substring(6).trim();
      document.getElementById("adQualOther").style.display = "block";
    } else {
      document.getElementById("adQual").value = qual;
    }

    var spec = a.specialization || "";
    var sel = document.getElementById("adSpec");
    var found = false;
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === spec) { found = true; break; }
    }
    if (found) { sel.value = spec; }
    else if (spec) {
      sel.value = "Other (Please specify)";
      document.getElementById("adSpecOther").value = spec.indexOf("Other:") === 0 ? spec.substring(6).trim() : spec;
      document.getElementById("adSpecOther").style.display = "block";
    }

    document.getElementById("adExp").value  = a.yearsExperience || "";
    document.getElementById("adUser").value = a.username || "";
    document.getElementById("adPass").value = "";

    previewAdminAvatar();
    syncCredentialStrip();

    document.getElementById("adFormTitle").innerHTML =
      '<i class="fas fa-pen-to-square" style="color:#818cf8"></i> Edit Administrator';
    document.getElementById("adSaveTxt").textContent = "Update record";
    var cred = document.getElementById("adCred");
    if (cred) { cred.style.display = "none"; cred.innerHTML = ""; }

    var card = document.getElementById("adFormCard");
    if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });

    toast("Editing " + a.fullName + ". Leave the password blank to keep it unchanged.", "fa-pen-to-square");
  });
}

function previewUploadedLogo(input) {
  var file = input && input.files && input.files[0];
  if (!file) return;
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) {
    input.value = "";
    toast("Choose a PNG, JPEG, or WebP image file.", "fa-triangle-exclamation");
    return;
  }
  var reader = new FileReader();
  reader.onload = function () {
    var preview = document.getElementById("stLogoPreview");
    if (!preview) return;
    if (preview.tagName.toLowerCase() !== "img") {
      var image = document.createElement("img");
      image.id = "stLogoPreview";
      image.alt = "School logo preview";
      image.style.cssText = "width:76px;height:76px;border-radius:15px;object-fit:contain;border:1px solid var(--line);background:#fff";
      preview.parentNode.replaceChild(image, preview);
      preview = image;
    }
    preview.src = reader.result;
  };
  reader.onerror = function () { toast("Could not read the selected logo image.", "fa-triangle-exclamation"); };
  reader.readAsDataURL(file);
}

function readUploadedSchoolLogo(file) {
  return new Promise(function (resolve, reject) {
    if (!file) { resolve(""); return; }
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) {
      reject(new Error("Choose a PNG, JPEG, or WebP image file."));
      return;
    }
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error("Could not read the selected logo image.")); };
    reader.onload = function () {
      var image = new Image();
      image.onerror = function () { reject(new Error("The selected logo file is not a valid image.")); };
      image.onload = function () {
        var maxSide = 320;
        var scale = Math.min(1, maxSide / Math.max(image.width, image.height));
        var canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        var context = canvas.getContext("2d");
        if (!context) { reject(new Error("Could not prepare the logo image.")); return; }
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        var quality = 0.86, data = canvas.toDataURL("image/jpeg", quality);
        while (data.length > 44000 && quality > 0.3) {
          quality -= 0.12;
          data = canvas.toDataURL("image/jpeg", quality);
        }
        if (data.length > 44000) {
          reject(new Error("The logo image is still too large. Choose a smaller image."));
          return;
        }
        resolve(data);
      };
      image.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

    if (!res || !res.ok) {
      toast(res ? res.error : "Could not load the account credentials", "fa-triangle-exclamation");
      return;
    }
    var credential = res.data || {};
    var password = credential.password || "(not recorded — reset to set a new password)";
    var details = [
    ["Full name", account.fullName],
    ["Role", account.roleLabel],
    ["Username", account.username],
    ["Password", password],
    ["Email", account.email || "—"],
    ["Phone", account.phone || "—"],
    ["Assignments", account.assignmentCount || 0],
    ["Status", account.isActive ? "Active" : "Disabled"],
    ["Last sign-in", account.lastLogin ? fdate(account.lastLogin) : "Never"],
    ["Created", account.createdAt ? fdate(account.createdAt) : "—"]
    ];
    var html = details.map(function (row) {
      return '<div class="row"><span class="k">' + esc(row[0]) + '</span><b style="overflow-wrap:anywhere">' +
        esc(row[1]) + '</b></div>';
    }).join("") + '<div style="display:flex;justify-content:flex-end;margin-top:14px">' +
      '<button class="btn sm alt" onclick="toggleReset(\'' + esc(account.id) + '\',\'' +
      esc(account.fullName).replace(/'/g, "\\'") + '\')"><i class="fas fa-key"></i> Reset password</button></div>';
    openModal("Staff Account Details", html);
  });
}

function editStaffAccount(userId) {
  var account = getStaffAccount(userId);
  if (!account) { toast("Staff account details are not available. Reload the list and try again.", "fa-triangle-exclamation"); return; }
  var html = '<div style="display:grid;gap:12px">' +
    '<div><label class="mini" for="editStaffName">Full name</label><input class="inp" id="editStaffName" value="' +
    esc(account.fullName) + '" style="width:100%;box-sizing:border-box"></div>' +
    '<div><label class="mini" for="editStaffEmail">Email</label><input class="inp" id="editStaffEmail" type="email" value="' +
    esc(account.email || "") + '" style="width:100%;box-sizing:border-box"></div>' +
    '<div><label class="mini" for="editStaffPhone">Phone</label><input class="inp" id="editStaffPhone" value="' +
    esc(account.phone || "") + '" style="width:100%;box-sizing:border-box"></div>' +
    '<button class="btn ok" onclick="saveStaffAccount(\'' + esc(account.id) +
    '\')"><i class="fas fa-floppy-disk"></i> Save changes</button></div>';
  openModal("Edit Staff Account", html);
}

function saveStaffAccount(userId) {
  var fullName = document.getElementById("editStaffName").value.trim();
  var email = document.getElementById("editStaffEmail").value.trim();
  var phone = document.getElementById("editStaffPhone").value.trim();
  if (!fullName) { toast("Full name is required.", "fa-triangle-exclamation"); return; }
  callApi({ action:"updateUser", token:TOKEN, id:userId, fullName:fullName, email:email, phone:phone })
    .then(function (res) {
      if (!res || !res.ok) { toast(res ? res.error : "Could not update the account", "fa-triangle-exclamation"); return; }
      var modal = document.getElementById("psmsModal");
      if (modal) modal.remove();
      toast("Staff account updated.");
      STORE = {}; clearPersistedStore(); go(PAGE);
    });
}

function deleteStaffAccount(userId, name) {
  if (!confirm("Delete the staff account of " + name + "?\n\nThis cannot be undone.")) return;
  callApi({ action:"deleteUser", token:TOKEN, id:userId }).then(function (res) {
    if (!res || !res.ok) { toast(res ? res.error : "Could not delete the account", "fa-triangle-exclamation"); return; }
    toast(res.data.fullName + " has been deleted.");
    STORE = {}; clearPersistedStore(); go(PAGE);
  });
}

function suggestPw() {
  var w = ["school","book","learn","smart","bright","future","study","grow"];
  var s = w[Math.floor(Math.random() * w.length)];
  return s.charAt(0).toUpperCase() + s.substring(1) + Math.floor(100 + Math.random() * 900) +
         "!@#$%&*".charAt(Math.floor(Math.random() * 7));
}

function suggestInto(inputId) {
  var el = document.getElementById(inputId);
  if (el) el.value = suggestPw();
}

function showCred(fullName, username, password) {
  var panel = document.getElementById("credPanel"), body = document.getElementById("credBody");
  if (!panel || !body) { toast("Account created — username " + username, "fa-circle-check"); return; }
  panel.style.display = "block";
  body.innerHTML =
    '<div style="font-size:13.5px;font-weight:700;color:#065f46;margin-bottom:11px">' +
    '<i class="fas fa-circle-check"></i> ' + esc(fullName) + ' has been provisioned</div>' +
    '<div style="font-size:12.5px;color:#065f46;margin-bottom:9px">' +
    'Share these credentials now — the password cannot be shown again.</div>' +
    '<div style="display:flex;gap:9px;flex-wrap:wrap">' +
    '<div style="flex:1;min-width:150px;padding:11px 13px;background:#fff;border:1px solid #a7f3d0;border-radius:11px">' +
    '<div class="mini">Username</div><code style="font-size:13px;font-weight:700">' + esc(username) + '</code></div>' +
    '<div style="flex:1;min-width:150px;padding:11px 13px;background:#fff;border:1px solid #a7f3d0;border-radius:11px">' +
    '<div class="mini">Password</div><code style="font-size:13px;font-weight:700">' + esc(password) + '</code></div></div>' +
    '<button class="btn sm" style="margin-top:11px" onclick="copyCred(\'' + esc(username) + '\',\'' + esc(password) + '\')">' +
    '<i class="fas fa-copy"></i> Copy credentials</button>';
  panel.scrollIntoView({ behavior:"smooth", block:"nearest" });
}

function hideCred() {
  var p = document.getElementById("credPanel");
  if (p) p.style.display = "none";
}

function copyCred(u, p) {
  var text = "PSMS credentials\nUsername: " + u + "\nPassword: " + p;
  try { navigator.clipboard.writeText(text); }
  catch (e) {
    var ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
  }
  toast("Credentials copied to clipboard.");
}

/* ---- Manager: create the Head of School ---- */
function createHead() {
  var fullName = document.getElementById("hodName").value.trim();
  var username = document.getElementById("hodUser").value.trim();
  var password = document.getElementById("hodPass").value;
  var email = document.getElementById("hodEmail").value.trim();
  var phone = document.getElementById("hodPhone").value.trim();

  if (!fullName) { toast("Enter the full name.", "fa-triangle-exclamation"); return; }
  if (!username) { toast("Enter a username.", "fa-triangle-exclamation"); return; }
  if (password.length < 6) { toast("Password must be at least 6 characters.", "fa-triangle-exclamation"); return; }

  callApi({ action:"createUser", token:TOKEN, role:"head", username:username, password:password,
            fullName:fullName, email:email, phone:phone }).then(function (res) {
    if (!res || !res.ok) { toast(res ? res.error : "Could not create the account", "fa-triangle-exclamation"); return; }
    showCred(res.data.fullName, res.data.username, res.data.password);
    toast("Head of School provisioned successfully.");
    STORE = {}; clearPersistedStore(); go("adminsAdmin");
  });
}

/* ---- HOD: create staff accounts ---- */
function createAccount() {
  var role = document.getElementById("nuRole").value;
  var fullName = document.getElementById("nuName").value.trim();
  var username = document.getElementById("nuUser").value.trim();
  var password = document.getElementById("nuPass").value;
  var email = document.getElementById("nuEmail").value.trim();
  var phone = document.getElementById("nuPhone").value.trim();

  if (!fullName) { toast("Enter the full name.", "fa-triangle-exclamation"); return; }
  if (!username) { toast("Enter a username.", "fa-triangle-exclamation"); return; }
  if (password.length < 6) { toast("Password must be at least 6 characters.", "fa-triangle-exclamation"); return; }

  var body = { action:"createUser", token:TOKEN, role:role, username:username, password:password,
               fullName:fullName, email:email, phone:phone };

  callApi(body).then(function (res) {
    if (!res || !res.ok) { toast(res ? res.error : "Could not create the account", "fa-triangle-exclamation"); return; }
    showCred(res.data.fullName, res.data.username, res.data.password);
    toast(getRoleLabelClient(res.data.role) + " account created.");
    document.getElementById("nuName").value = "";
    document.getElementById("nuUser").value = "";
    document.getElementById("nuPass").value = "";
    STORE = {}; clearPersistedStore(); go("staffAdmin");
  });
}
